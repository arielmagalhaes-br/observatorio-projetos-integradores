{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Conecta PI{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/card.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/buttons.css'%}">
    <link rel="stylesheet" href="{% static 'css/components/inputs.css'%}">  

    {% block extra_css %}{% endblock %}
</head> 
<body>
    <div class="app-layout">
        
        <aside class="sidebar" id="sidebar">
            
            <div class="sidebar__header">
                <div class="sidebar__logo-wrapper">
                    <img src="{% static 'css/img/logo.png' %}" alt="Conecta PI" class="sidebar__logo">
                </div>
                <button class="sidebar__toggle" id="toggle-btn">
                    <svg class="toggle-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <polyline points="14 8 10 12 14 16"></polyline>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar__nav">
                
                <span class="sidebar__label">MENU</span>

                <a href="{% url 'home' %}" class="sidebar__link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="sidebar__text">Página Inicial</span>
                </a>

                <a href="{% url 'novo_projeto' %}" class="sidebar__link {% if request.resolver_match.url_name == 'novo_projeto' %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        <line x1="12" y1="11" x2="12" y2="17"></line>
                        <line x1="9" y1="14" x2="15" y2="14"></line>
                    </svg>
                    <span class="sidebar__text">Novo Projeto</span>
                </a>

                <a href="{% url 'meus_projetos' %}" class="sidebar__link {% if request.resolver_match.url_name == 'meus_projetos' %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="sidebar__text">Meus Projetos</span>
                </a>

                    </nav>
                    
                    <div class="sidebar__footer">
                        <a href="#" class="sidebar__link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span class="sidebar__text">Sair</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('toggle-btn');
            const sidebar = document.getElementById('sidebar');

            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar--collapsed');
            });
        });
    </script>
</body>
</html>
