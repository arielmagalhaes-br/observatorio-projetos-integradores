{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta PI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Estilos -->
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/gateway.css' %}">
    <link rel="shortcut icon" href="{% static 'css/img/logo.png' %}" type="image/png">
</head>
<body>
    <div class="gateway-container">
        
        <header class="gateway-header">
            <img src="{% static 'css/img/logo.png' %}" alt="Logo Conecta PI" class="gateway-logo">
            <h1 class="gateway-title">Como você deseja acessar?</h1>
            <span class="gateway-decorator"></span>
        </header>

        <div class="gateway-grid">
            <!-- Aluno -->
            <a href="{% url 'login' %}?perfil=aluno" class="gateway-card">
                <div class="gateway-card__icon gateway-card__icon--aluno">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <h2 class="gateway-card__title">Sou Aluno</h2>
                <p class="gateway-card__subtext">Acessar meus projetos e vitrine</p>
            </a>

            <!-- Professor -->
            <a href="{% url 'login' %}?perfil=professor" class="gateway-card">
                <div class="gateway-card__icon gateway-card__icon--professor">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
                    </svg>
                </div>
                <h2 class="gateway-card__title">Sou Professor</h2>
                <p class="gateway-card__subtext">Acessar curadoria e orientações</p>
            </a>

            <!-- Administrador -->
            <a href="{% url 'login' %}?perfil=admin" class="gateway-card">
                <div class="gateway-card__icon gateway-card__icon--admin">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </div>
                <h2 class="gateway-card__title">Sou Administrador</h2>
                <p class="gateway-card__subtext">Gestão do sistema</p>
            </a>
            
        </div>

    </div>
</body>
</html>
