{% for projeto in projetos_recentes %}
    <a href="{% url 'detalhe_projeto' projeto.id %}" class="project-item" style="text-decoration: none;">
        <div class="project-item__info">
            {% if projeto.capa_url %}
                <img src="{{ projeto.capa_url }}" alt="Logo {{ projeto.titulo }}" class="project-item__logo" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;">
            {% else %}
                <div class="project-item__icon-placeholder" style="width: 40px; height: 40px; border-radius: 6px; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; color: #9ca3af; flex-shrink: 0;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
            {% endif %}
            <div>
                <h3 class="project-item__name">{{ projeto.titulo }}</h3>
                <p class="project-item__details">Semestre: {{ projeto.semestre }}</p>
            </div>
        </div>
        <span class="status-badge status-{{ projeto.status|lower }}">
            {{ projeto.get_status_display }}
        </span>
    </a>
{% empty %}
    <div class="vitrine-empty-state" style="padding: 24px 12px; text-align: center; background: #ffffff; border-radius: 8px; border: 1px dashed #e5e7eb; width: 100%;">
        <p class="empty-subtitle" style="color: #6b7280; font-size: 0.9rem;">Nenhum projeto recente encontrado.</p>
    </div>
{% endfor %}
